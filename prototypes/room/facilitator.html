<!doctype html>

<title>Case · Facilitator console</title>

<style>
  /* Facilitator console. The spatial grid (CASE-113): the orientation band on top (case, beat, phase,
     timer, connection, then the two tabs); in Run, the left column is what the room sees and the right
     column is the decision (phase, answered count, the path); the ONE primary action sits in the dock
     at the same place in every phase. Room holds people, displays, names, settings, manual mode and the
     end (CASE-118). Explanations sit behind info disclosures. */
  /* The sticky band and the fixed action dock never cover the focused control (WCAG 2.4.11). */
  html { scroll-padding-top: 132px; scroll-padding-bottom: 120px; }
  body { padding-bottom: 104px; font-size: var(--t-md); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--sp-5); }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: var(--t-xl); letter-spacing: -.015em; }
  h2 { font-size: var(--t-md); }
  h1:focus, h2:focus { outline: none; }
  .stack { display: grid; gap: var(--sp-4); align-content: start; }
  .card { padding: var(--sp-5); }
  .card > * + * { margin-top: var(--sp-3); }
  .cardhead { display: flex; align-items: center; gap: var(--sp-2); justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--sp-5); align-items: start; padding-top: var(--sp-5); }
  @media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }
  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -4px; }
  .ic.sm { width: 16px; height: 16px; }

  /* orientation band (petrol-tinted zone) + tabs */
  .strip { position: sticky; top: 0; z-index: var(--z-sticky); background: var(--nav-bg); border-bottom: 1px solid var(--nav-line); color: var(--nav-ink); }
  .strip .row1 { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); align-items: center; padding-top: var(--sp-3); padding-bottom: var(--sp-2); }
  .si { display: inline-flex; gap: var(--sp-2); align-items: center; font-size: var(--t-sm); min-height: 28px; }
  .si b { font-weight: var(--w-semibold); }
  .si .k { color: var(--ink-muted); font-size: var(--t-xs); font-weight: var(--w-semibold); text-transform: uppercase; letter-spacing: .08em; }
  .si.beat { flex: 1 1 260px; min-width: 0; display: grid; gap: 0; }
  .si.beat .case { font-size: var(--t-xs); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .si.beat b { font-size: var(--t-md); overflow-wrap: anywhere; }
  .si .num { font-family: var(--mono); font-weight: var(--w-semibold); }
  .strip .tag { background: var(--surface); border: 1px solid var(--nav-line); }
  .strip .tag.ok, .strip .tag.warn, .strip .tag.bad { border-color: transparent; }
  [role="tablist"] { display: flex; gap: var(--sp-1); margin-bottom: -1px; }
  [role="tab"] { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 44px; padding: var(--sp-2) var(--sp-4); border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: transparent; color: var(--ink-muted); font-size: var(--t-sm); font-weight: var(--w-semibold); }
  [role="tab"][aria-selected="true"] { background: var(--ground); color: var(--ink); border-color: var(--nav-line); }
  [role="tab"]:hover:not([aria-selected="true"]) { color: var(--ink); background: color-mix(in srgb, var(--surface) 50%, transparent); }
  [role="tab"] .badge { min-width: 22px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--petrol-tint); color: var(--petrol-ink); font-size: var(--t-xs); text-align: center; }

  .banners { display: grid; gap: var(--sp-2); padding-top: var(--sp-4); }
  .banners:empty { display: none; }
  .banner { flex-wrap: wrap; border: 1px solid transparent; }
  .banner .grow { flex: 1 1 260px; display: grid; gap: 2px; }
  .banner .grow span { font-weight: var(--w-regular); font-size: var(--t-sm); }
  .banner.manual { border-color: var(--manual); }
  .banner.alert { border-color: var(--alert); }

  .row-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .status-line { font-size: var(--t-md); color: var(--ink); }
  .cue { background: var(--sunken); border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-4); font-size: var(--t-sm); }
  .cue .eyebrow { margin-bottom: 4px; }
  .body-text { font-size: var(--t-md); line-height: 1.5; white-space: pre-line; }
  .prompt { font-size: var(--t-lg); font-weight: var(--w-semibold); line-height: 1.3; }
  .phase { box-shadow: inset 0 4px 0 var(--ph, var(--petrol)), var(--shadow-1); }
  .phase .cardhead .pill { flex: none; }
  .count { display: inline-flex; align-items: center; gap: var(--sp-2); font-weight: var(--w-medium); }
  .count .num { font: var(--w-semibold) var(--t-lg)/1 var(--mono); }

  .rows { list-style: none; margin: 0; padding: 0; display: grid; }
  .rows li { display: grid; grid-template-columns: 22px 28px minmax(80px, 150px) 1fr; gap: var(--sp-2); align-items: center; padding: var(--sp-2) 0; border-bottom: 1px solid var(--line); min-height: 44px; font-size: var(--t-sm); }
  .rows.plain li { grid-template-columns: 22px 1fr auto; }
  .rows li:last-child { border-bottom: 0; }
  .rows .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--w-medium); }
  .rows .ans { overflow-wrap: anywhere; }
  .rows .none { color: var(--ink-muted); }
  .agg { display: grid; gap: var(--sp-2); }
  .agg div { display: grid; grid-template-columns: 1fr auto auto; gap: var(--sp-3); padding: 4px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: var(--t-sm); }
  .agg .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: var(--w-semibold); }
  .agg .lbl { display: inline-flex; gap: var(--sp-2); align-items: center; }
  .agg .bar { display: block; grid-column: 1 / -1; height: 6px; border-radius: var(--radius-pill); background: var(--sunken); overflow: hidden; padding: 0; }
  .agg .bar i { display: block; height: 100%; background: var(--petrol); }

  .routes { border: 0; margin: 0; padding: 0; display: grid; gap: var(--sp-2); }
  .routes legend { padding: 0; font-weight: var(--w-semibold); font-size: var(--t-sm); margin-bottom: var(--sp-2); }
  .route { display: grid; grid-template-columns: 24px 1fr; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; }
  .route:has(input:checked) { border: 2px solid var(--petrol); padding: calc(var(--sp-3) - 1px) calc(var(--sp-4) - 1px); background: var(--petrol-tint); }
  .route:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .route.locked { cursor: not-allowed; background: var(--ph-paused-tint); color: var(--ph-paused-ink); }
  .route input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--petrol); }
  .route .t { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-weight: var(--w-semibold); }
  .route .meta { display: grid; gap: 3px; font-size: var(--t-sm); margin-top: 6px; }
  .route .meta span b { font-weight: var(--w-semibold); }
  .route details.more { margin-top: 6px; font-size: var(--t-sm); }
  .route details.more summary { cursor: pointer; color: var(--petrol-ink); font-weight: var(--w-semibold); min-height: 28px; display: inline-flex; align-items: center; }
  .cls { display: inline-flex; gap: 6px; align-items: center; font-weight: var(--w-medium); font-size: var(--t-sm); }
  .cls.unsafe, .cls.terminal { color: var(--alert-ink); }
  .cls.sound { color: var(--ok-ink); }
  .subhead { font-size: var(--t-xs); font-weight: var(--w-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); margin: 6px 0 -2px; }

  .join { display: grid; gap: var(--sp-2); }
  .join .code { font: var(--w-semibold) 44px/1 var(--mono); letter-spacing: .06em; }
  .join .url { font: var(--w-medium) var(--t-md) var(--mono); }
  .points { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: var(--t-md); line-height: 1.45; }
  .points li::marker { color: var(--petrol); }
  .scene-prose { font-size: var(--t-md); line-height: 1.55; }
  .vitals { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); margin: 0; padding: var(--sp-3) var(--sp-4); list-style: none; background: var(--sunken); border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; }
  .vitals li { display: grid; font-size: var(--t-sm); }
  .vitals .l { font-size: var(--t-xs); font-weight: var(--w-semibold); color: var(--ink-muted); }
  .vitals .v { font: var(--w-semibold) var(--t-md) var(--mono); }
  .vitals .u { font: var(--w-regular) var(--t-xs) var(--sans); color: var(--ink-muted); }
  .vitals .tr { font: var(--w-medium) var(--t-xs) var(--mono); }
  .tiles2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--sp-3); }
  .tiles2 > div { background: var(--ground); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-4); }
  .tiles2 .points { font-size: var(--t-sm); }
  details.notes { border: 1px dashed var(--field-line); border-radius: var(--radius-sm); padding: var(--sp-3) var(--sp-4); background: var(--sunken); }
  details.notes summary { cursor: pointer; font-weight: var(--w-semibold); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); min-height: 28px; display: flex; align-items: center; }
  details.notes p { margin-top: var(--sp-2); font-size: var(--t-sm); line-height: 1.55; white-space: pre-line; }
  .opt { display: inline-flex; gap: var(--sp-2); align-items: center; min-width: 0; }
  .mark { flex: none; }
  .optlist { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; padding: 0; list-style: none; font-size: var(--t-sm); }
  .hint { font-size: var(--t-sm); color: var(--ink-muted); }

  .strip-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--t-sm); }
  .strip-list li { display: flex; gap: var(--sp-2); align-items: center; padding: 3px 6px; border-radius: 6px; }
  .strip-list li[aria-current] { background: var(--petrol-tint); font-weight: var(--w-semibold); }
  .strip-list button { min-height: 44px; width: 100%; text-align: left; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
  .strip-list button:hover, .strip-list button:focus-visible { border-color: var(--field-line); background: var(--sunken); }

  /* primary action dock: the same screen position in every phase and on both tabs */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-dock); background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow-2); }
  .dock .wrap { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-4); align-items: center; padding-top: var(--sp-3); padding-bottom: var(--sp-3); }
  .dock .prim { grid-column: 2; justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 100%; }
  .dock .back { grid-column: 1; grid-row: 1; justify-self: start; }
  .dock .prim { grid-row: 1; }
  .btn.big { min-height: 52px; padding: var(--sp-3) var(--sp-6); font-size: var(--t-md); max-width: 560px; text-align: center; }
  .btn.armed { background: var(--petrol-deep); outline: 3px solid var(--focus); outline-offset: 2px; }
  .reason { font-size: var(--t-xs); color: var(--ink-muted); }

  .drow { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: flex-end; margin-top: 6px; }

  .roster li:last-child { border-bottom: 0; }
  .roster .who { display: inline-flex; align-items: center; gap: var(--sp-2); flex: 1; min-width: 0; font-weight: var(--w-medium); }
  .roster .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster .btns { display: flex; gap: 6px; }
  .roster .btn { min-height: 36px; padding: 4px 10px; font-size: var(--t-xs); }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .chips li { display: inline-flex; align-items: center; gap: 6px; max-width: 14em; padding: 3px 10px 3px 3px; border-radius: var(--radius-pill); background: var(--ground); border: 1px solid var(--line); font-size: var(--t-sm); font-weight: var(--w-medium); }
  .chips li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: var(--t-sm); }
  .kv dt { color: var(--ink-muted); }
  .kv dd { margin: 0; }
  .marker { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: end; }
  .marker label { display: grid; gap: 4px; font-weight: var(--w-semibold); font-size: var(--t-sm); flex: 1 1 260px; }
  .marker input { padding: 8px 10px; min-height: 44px; border: 1px solid var(--field-line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); }
  .fence { max-width: 640px; margin: 64px auto; padding: 28px; }
  .fence > * + * { margin-top: 12px; }
  @media (forced-colors: active) { .route, [role="tab"][aria-selected="true"] { border: 1px solid CanvasText; } }
.ranked-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); width: 100%; }
.ranked-controls label { display: grid; gap: var(--sp-1); font-weight: var(--w-medium); max-width: 100%; }
.ranked-controls select { min-height: 44px; max-width: 100%; padding: var(--sp-2); background: var(--surface); color: var(--ink); border: 1px solid var(--field-line); border-radius: var(--radius-sm); font: inherit; }
.ranked-controls p { width: 100%; margin: 0; }
</style>

    h('strong', null, 'The projector window did not open'),
    h('span', null, 'The browser may have blocked it. Open this link in a new window, drag it to the second screen and make it full screen:'),

/** Windows "Duplicate" mode, or one screen: suggest the phone as the console. Never forced (CASE-102). */
function phoneConsoleHint() {

    h('strong', null, 'This computer is showing one screen'),

function pingProjector() { try { localChannel.postMessage({ t: 'show_projector' }); } catch { /* no channel */ } }

/* ───────── Room tab (CASE-118): people, displays, names, settings, manual mode, the end ───────── */
function roomPanel(v) {
  const A = new Set(v.actions), ok = canCmd(), manual = S.mode === 'manual';
  const people = activeParticipants(v);
  const pending = manual ? S.la.events.length : link.pendingCount;
  const proj = S.projector === 'confirmed' || S.projector === 'separate' ? 'Projector is showing' : projectorOpen() ? 'Projector window open' : 'Not paired';
  const card = (id, ic, title, about, ...body) => h('section', { class: 'card panel', 'aria-labelledby': id }, h('div', { class: 'cardhead' }, h('h2', { id }, icon(ic, true), title), about ? info(title.toLowerCase(), about) : null), ...body);
  return h('div', { class: 'room-grid' }, h('div', { class: 'stack' },
    card('dRoster', 'people', `People · ${people.length}`, 'Everyone who has joined. Rename fixes a name for the whole room; Remove takes away their access and discards any answer in the open round.',
      people.length ? h('ul', { class: 'roster', 'aria-label': 'In the room' }, people.map((p) => h('li', null, h('span', { class: 'who' }, avatarEl(p.avatarId, { size: 28, name: p.name ?? '' }), h('span', null, p.name || 'Unnamed')),
        h('span', { class: 'muted' }, new Date(p.joinedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })),
        h('span', { class: 'btns' }, button('Rename', () => askRename(p), { k: `rn:${p.id}`, cls: 'tertiary', disabled: !ok, props: { 'aria-label': `Rename ${p.name || 'this participant'}` } }), button('Remove', () => askRemove(p), { k: `rm:${p.id}`, cls: 'danger', disabled: !ok, props: { 'aria-label': `Remove ${p.name || 'this participant'} from room` } }))))) : h('p', { class: 'muted' }, 'No one has joined yet'),
      h('p', { class: 'muted' }, `Join code ${formatCode(v.joinCode)} · ${joinUrl(v.joinCode).replace('https://', '')}`),
      A.has('close_joining') ? cmdBtn(v.joiningClosed ? 'Reopen joining' : 'Close joining', 'close_joining', { closed: !v.joiningClosed }, { k: 'dJoin' }) : null)),
    h('div', { class: 'stack' },
    card('dNamesH', 'projector', 'Names on the projector', v.phase === 'lobby' ? 'The lobby automatically shows names and avatars; no switch is needed.' : 'During play, Hide responses before showing names. Closing or showing responses clears names to keep answer counts anonymous.',
      h('p', null, v.phase === 'lobby' ? 'Names and avatars appear in the lobby.' : v.resultsShown !== false && A.has('show_results') ? 'A response chart is on the projector; names are withheld.' : v.namesShown ? 'Names and avatars are on the projector.' : 'Names are not shown on the projector.'),
      A.has('show_names') ? button(v.namesShown ? 'Hide names on projector' : 'Show names on projector', () => toggleNames(v), { k: 'dNames', disabled: !ok }) : null),
    card('dDisp', 'projector', 'Displays', 'Open the projector window on this computer, or pair a separate display: open its pair page and type the code it shows.',
      h('dl', { class: 'kv' }, h('dt', null, 'Projector'), h('dd', null, proj)),
      h('div', { class: 'row-actions' },
        button('Open projector window', openProjector, { k: 'dOpenProj', ic: 'projector' }),
        button('Run the display check again', () => { S.projector = 'unchecked'; pingProjector(); S.tab = 'run'; say('Confirm the display check in the lobby'); render(); }, { k: 'dRecheck', cls: 'tertiary', disabled: v.phase !== 'lobby' })),
      pairForm(manual)),
    card('dSet', 'gear', 'Settings', null,
      A.has('set_timer') ? h('div', { class: 'row-actions' }, button('Set timer', askTimer, { k: 'dTimer', disabled: !ok, ic: 'clock' }), info('the timer', 'The timer is advisory: it never locks the round. The room sees it rounded to the minute.')) : h('p', { class: 'muted' }, 'The timer can be set while a decision is open.')),
    card('dManual', 'manual', 'Manual room', 'Lead the room from this device without the network: phones cannot vote, and you choose and reveal routes by hand. When the connection is back, rejoin online at the next decision and the choices upload.',
      manual ? h('p', null, 'Manual room mode is on for this device.')
        : A.has('enter_manual') ? button('Enter manual room mode', askEnterManual, { k: 'dManualBtn', ic: 'manual' })
          : h('p', { class: 'muted' }, 'Not available at this point in the case.'),
      h('dl', { class: 'kv', 'aria-label': 'Recovery tray' }, h('dt', null, 'Revision'), h('dd', null, `Revision ${v.revision} · epoch ${v.epoch}`), h('dt', null, 'Events'), h('dd', null, `${pending} pending · ${S.sent} sent`)),
      S.results.length ? h('div', null, h('p', { class: 'subhead' }, 'After the last recovery'), h('ul', { class: 'roster' }, S.results.map((r) => h('li', null, icon('tick', true), r)))) : null,
      manual && A.has('resume_online') && !S.upload ? button('Rejoin online at the next decision', () => { S.tab = 'run'; resumeOnline(); }, { k: 'dRejoin' }) : null,
      manual && S.upload ? h('p', { class: 'muted' }, S.upload.state === 'failed' ? 'The last upload was not accepted · see the banner' : 'Upload in progress or waiting for the connection') : null),
    card('dEndH', 'door', 'This console', 'Take over moves control of the room to this console. End room closes the session for everyone; participants keep a private recap for 24 hours.',
      h('div', { class: 'row-actions' },
        button('Take over this room', confirmTakeover, { k: 'dTakeover', cls: 'tertiary', disabled: conn() !== 'online' || manual }),
        A.has('end') ? button('End room', confirmEnd, { k: 'dEnd', cls: 'danger', disabled: !ok }) : null))));
}

/* Pair a separate display (real Worker only): the facilitator types the code the display shows. */
function pairForm(manual) {
  if (typeof link.approveDisplay !== 'function') return null;
  return h('form', { class: 'marker', on: { submit: (e) => { e.preventDefault(); pairDisplay(); } } },
    h('label', null, 'Display code', h('input', { 'data-k': 'pairCode', maxlength: 12, value: S.pairCode, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', on: { input: (e) => { S.pairCode = e.target.value; } } })),
    h('button', { type: 'submit', class: 'btn', 'data-k': 'pairBtn', disabled: S.pairing || manual || conn() !== 'online' || null }, 'Pair a display'),
    S.pairMsg ? h('p', { class: 'muted', role: 'status', style: 'flex-basis:100%;font-size:var(--t-xs)' }, S.pairMsg) : null);
}
async function pairDisplay() {
  const code = S.pairCode.replace(/[\s-]/g, '').toUpperCase();
  if (!code) return;
  S.pairing = true; S.pairMsg = 'Pairing…'; render();
  const r = await link.approveDisplay(code);
  S.pairing = false;
  if (r.ok) { S.pairCode = ''; S.pairMsg = 'Display paired'; if (S.projector === 'unchecked') S.projector = 'separate'; say('Display paired · it shows the room now'); }
  else S.pairMsg = r.error === 'unknown_or_expired_code' ? 'That code is not waiting to pair · check the display' : r.error === 'already_paired' ? 'That display is already paired' : `Not paired · ${String(r.error).replaceAll('_', ' ')}`;
  render(); refocus('pairCode');
}

/* ───────── pages ───────── */
function fencedPage() {
  return h('main', { class: 'wrap' }, h('section', { class: 'fence card panel' }, icon('lock'), h('h1', { tabindex: -1, id: 'fenceH' }, 'This room is now controlled from another device'),
    h('p', { class: 'muted' }, 'This console has no controls. Phones and the projector are unchanged.')));
}
function standbyPage(v) {
  return h('main', { class: 'wrap' }, h('section', { class: 'fence card panel' }, icon('people'), h('h1', { tabindex: -1 }, 'This room is open on another device'),
    h('p', { class: 'muted' }, 'Only one console controls a room at a time.'),
    button('Take over this room', confirmTakeover, { k: 'standbyTake', cls: 'primary big', disabled: conn() !== 'online' })));
}
function consolePage(v) {
  const st = statusText(v), A = new Set(v.actions);
  if (S.tab === 'room') {
    return h('main', { class: 'wrap' }, banners(v), h('div', { role: 'tabpanel', id: 'panel-room', 'aria-labelledby': 'tab-room' }, roomPanel(v)), dock(v));
  }
  let left, right = [];
  const [ph] = PHASE_PILL[v.phase] ?? ['reveal'];
  const card = h('section', { class: 'card panel phase', 'data-phase': ph, 'aria-labelledby': 'phaseH' },
    h('p', { class: 'eyebrow' }, v.manual ? 'Manual room' : 'Phase'),
    h('h1', { id: 'phaseH', tabindex: -1 }, heading(v)),
    v.phase === 'surface_live' && v.liveSurface ? h('p', { class: 'body-text', style: 'font-weight:var(--w-semibold)' }, v.liveSurface.title) : null,
    st ? h('p', { class: 'status-line' }, st) : null,
    phaseBody(v),
    secondaryRow(v));
  if (v.phase === 'lobby') {
    const lc = lobbyCards(v);
    left = lc.left; right = [card, ...lc.right];
  } else {
    right = [card];
    if (v.round?.aggregate && ['responses_locked', 'path_selected'].includes(v.phase)) right.push(aggregateCard(v));
    if (A.has('select_path') && v.decision) right.push(resolutionPanel(v));
    right.push(pathCard(v));
    left = [surfaceCard(v), cueCard(v), v.nextBeat && ['surface_live', 'consequence_revealed'].includes(v.phase) ? h('p', { class: 'muted' }, `Next: ${v.nextBeat.title}`) : null, replayStrip(v)];
  }
  return h('main', { class: 'wrap' }, banners(v), h('div', { role: 'tabpanel', id: 'panel-run', 'aria-labelledby': 'tab-run', class: 'grid2' },
    h('div', { class: 'stack', role: 'region', 'aria-label': v.phase === 'lobby' ? 'Join and people' : 'What the room sees' }, left),
    h('div', { class: 'stack', role: 'region', 'aria-label': 'Decision' }, right)), dock(v));
}

/* ───────── a reload during a total outage (AS-061) ─────────
   The shell came from the offline cache, but the case pack and the room mirror were memory-only
   (CASE-092), so manual room mode cannot restart until the connection returns. Say so plainly, keep
   the saved segment, and offer its notes. Online again, tryRestore() continues the manual segment. */
const bootAt = Date.now();
function offlineShell() {
  if (!realRoom()) return null; // the lab has no outage reload: its server is the lab page itself
  const offline = navigator.onLine === false || (Date.now() - bootAt > 8000 && !link.snapshot);
  if (!offline) return null;
  const sid = realRoom()?.sessionId ?? null;
  const saved = sid ? LocalAuthority.saved(sid) : null;
  return h('main', { class: 'wrap' }, h('section', { class: 'card panel', style: 'margin-top:16px', 'aria-labelledby': 'offH' },
    icon('offline'),
    h('h1', { id: 'offH', tabindex: -1 }, 'Offline after a reload'),
    h('p', null, 'This console keeps the case only in memory, so the reload cleared it. It cannot run manual room mode until the connection returns and it can load the case again.'),
    saved ? h('p', null, `Your manual room segment is kept on this device (${saved.events.length} recorded steps${saved.markers?.length ? `, ${saved.markers.length} markers` : ''}). When the connection returns, the console reloads the case and continues it.`)
      : h('p', null, 'Lead the room from your own notes for now. The projector and phones keep what they were showing.'),
    saved ? button('Download your notes', () => downloadText(LocalAuthority.notesFromSaved(saved), `case-manual-notes-${saved.segmentId}.txt`), { k: 'offNotes' }) : null,
    h('p', { class: 'muted' }, 'This page reconnects by itself. Keep it open.')));
}
function downloadText(text, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
addEventListener('online', () => scheduleRender());
addEventListener('offline', () => scheduleRender());
setTimeout(() => scheduleRender(), 8100);

/* ───────── render loop ───────── */
let queued = false;
const scheduleRender = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };
function render() {
  const ae = document.activeElement;
  const key = ae?.dataset?.k, sel = ae && 'selectionStart' in ae && ae.tagName === 'INPUT' ? [ae.selectionStart, ae.selectionEnd] : null;
  const v = view();
  let page;
  if (S.fenced) page = fencedPage();
  else if (S.standby && v) page = standbyPage(v);
  else if (!v) page = offlineShell() ?? h('main', { class: 'wrap' }, h('section', { class: 'card panel', style: 'margin-top:16px' }, h('h1', null, conn() === 'connecting' ? 'Connecting…' : 'Waiting for the room'), h('p', { class: 'muted' }, 'Controls appear when the room answers.')));
  else {
    const k2 = `${v.phase}:${v.round?.id ?? ''}:${v.sessionId}`;
    if (k2 !== S.pickKey) { S.pickKey = k2; S.pick = null; S.armedUntil = 0; }
    if (S.pick && (!v.decision || pathOf(v, S.pick)?.explored)) S.pick = null;
    page = consolePage(v);
  }
  if (S.fenced && $('#dlg').open) $('#dlg').close();
  $('#app').replaceChildren(...(S.fenced ? [page] : [runStrip(v), page]));
  if (key) { const el = document.querySelector(`[data-k="${CSS.escape(key)}"]`); if (el && el !== document.activeElement && !$('#dlg').open) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch { /* not text */ } } }
  const ann = !v || S.fenced || S.standby ? '' : `${heading(v)}${v.liveSurface ? ` · ${v.liveSurface.title}` : ''}`;
  if (ann && ann !== S.announced) { S.announced = ann; announce(ann); }
}

document.addEventListener('keydown', (event) => {
  const v = view();
  if (!v || !canCmd() || document.querySelector('dialog[open]')) return;
  const nav = presentationNav(v);
  const action = facilitatorKey(event, {
    hasMoreGroup: Boolean(v.presentation?.nextGroup), replaying: nav.replaying,
    canReplayBack: nav.canBack, canReplayForward: nav.canForward,
  });
  if (!action) return;
  event.preventDefault();
  if (action === 'reveal_group') void cmd('advance');
  else if (action === 'replay_back') void cmd('replay', { entryIndex: nav.backTarget });
  else if (action === 'replay_forward') void cmd('replay', { entryIndex: nav.forwardTarget });
});

link.on('snapshot', (snap) => {
  if (S.standby || S.knownEpoch === null) S.knownEpoch = snap.epoch;
  else if (S.mode === 'network' && snap.epoch > S.knownEpoch) {
    if (S.selfBump > 0) S.knownEpoch = snap.epoch; else fence(); // the epoch rose and this tab did not cause it
  }
  scheduleRender();
});
link.on('status', (s) => {
  if (s === 'online') { S.hadOnline = true; if (S.upload?.state === 'waiting') doUpload(); }
  if (s === 'lost' && S.mode === 'network') announce('Offline · Switch to manual room', true);
  scheduleRender();
});
link.on('case_pack', scheduleRender);
// A reload keeps the manual segment in session storage (CASE-093), but the mirror and case pack are
// memory-only (CASE-092): once online again, rebuild manual mode from a fresh mirror plus the segment.
function tryRestore() {
  const snap = link.snapshot, pack = link.casePack;
  if (S.restoreTried || S.mode !== 'network' || !snap?.mirror || !pack) return;
  S.restoreTried = true;
  const saved = LocalAuthority.saved(snap.view.sessionId);
  if (!saved) return;
  const la = LocalAuthority.restore(snap.mirror, pack, saved);
  if (!la) { say('A saved manual segment no longer applies · following the room'); return; }
  S.entryVoided = false; S.entryEpoch = snap.epoch;
  S.la = la; S.mode = 'manual'; S.gen++; S.pick = null; S.upload = null; S.results = [];
  announce('Manual room mode restored after a reload', true);
  render();
}
link.on('snapshot', tryRestore);
link.on('case_pack', tryRestore);
link.on('error', (e) => say(`Connection error · ${e}`));

// one-second tick: advisory timer text only (re-render when it reaches zero)
let wasUp = false;
setInterval(() => {
  const v = view(), t = timerInfo(v);
  document.querySelectorAll('.js-timer').forEach((n) => { if (t) n.textContent = `${mss(t.left)} left`; });
  document.querySelectorAll('.js-timer-words').forEach((n) => { if (t) n.textContent = `· room sees "${timerWords(t.left)}"`; });
  const up = Boolean(t && !t.paused && t.left === 0);
  if (up !== wasUp) { wasUp = up; render(); if (up) announce('Time is up · locking is still your call'); }
}, 1000);

render();
window.caseFacilitator = { S, view, cmd }; // for scripted checks
</script>
