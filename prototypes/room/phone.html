<style>
  /* Participant phone (stage C). Rendering rule: every string from the case or from a participant is

  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; scroll-padding-bottom: 96px; } /* the sticky header and the fixed Live surface bar never hide the focused control (WCAG 2.4.11) */

  .top .pill svg { flex: none; }

  .conn { margin: var(--sp-2) var(--sp-4) 0; }
  .conn .banner { font-size: var(--t-sm); }
  .conn .banner.lost { background: var(--alert-tint); color: var(--alert-ink); }
  .conn .banner.wait { background: var(--sunken); color: var(--ink); }
  .note { margin: var(--sp-2) var(--sp-4) 0; min-height: 0; font-size: var(--t-sm); font-weight: var(--w-semibold); color: var(--petrol-ink); }
  .note:empty { display: none; }
  #menu { margin: var(--sp-2) var(--sp-4) 0; padding: var(--sp-4); }

  h2 { font-size: var(--t-lg); }

  .card { padding: var(--sp-4); display: grid; gap: var(--sp-3); }

  .small { font-size: var(--t-sm); }

  /* information: one scene card, then bento tiles (CASE-116, CASE-117) */
  .scene { gap: var(--sp-2); }
  .scene .prose { font-size: var(--t-md); line-height: 1.55; }

  .vitals { list-style: none; margin: 0; padding: var(--sp-3) var(--sp-4); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3) var(--sp-2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .vitals li { display: grid; align-content: start; min-width: 0; }

  .vitals .vv { font: var(--w-semibold) var(--t-lg)/1.15 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .vitals .vu { display: inline-block; font-size: var(--t-xs); font-weight: var(--w-regular); color: var(--ink-muted); margin-left: 3px; font-family: var(--sans); white-space: nowrap; }
  .vitals .arrow { font: var(--w-medium) var(--t-xs)/1.3 var(--mono); }
  details.ctx { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

  /* avatar picker (CASE-119): a radio group of 16 vendored drawings, each with a spoken label */

  .av:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

  .opt input { position: absolute; opacity: 0; width: 100%; height: 100%; inset: 0; margin: 0; cursor: inherit; }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 3px; }
  .opt .mk { display: grid; }
  .opt .lbl { overflow-wrap: anywhere; line-height: 1.35; font-weight: var(--w-medium); }
  .opt .ind { width: 24px; height: 24px; border: 2px solid var(--field-line); border-radius: 50%; display: grid; place-items: center; color: transparent; background: var(--surface); }

  .cls { display: inline-flex; gap: 6px; align-items: center; font-weight: var(--w-semibold); }
  ul.plain, ol.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

  }
  @media print {

    body { background: #fff; }
  }

function pickMode() {
  const v = S.view;

  if (v?.you) return 'room';
  if (link.hasToken) return 'connecting';
  return 'join';

function render() {
  const mode = pickMode();
  if (mode !== S.mode) {
    const first = S.mode === null;
    S.mode = mode;
    mountMode(mode);
    if (!first) queueMicrotask(() => focusIfLost());
  }
  renderHeader();
  renderConn();

}

function mountMode(mode) {

/**
 * The name field (CASE-119): required, 3–20 letters, numbers, spaces, hyphens or apostrophes; duplicates
 * allowed. Checked as you type once you have typed, and again on submit; the server checks it too.
 */
function nameField(prefix, { value = '' } = {}) {
  const input = h('input', { type: 'text', id: `${prefix}-name`, maxlength: String(NAME_MAX + 10), autocomplete: 'nickname', autocapitalize: 'words', enterkeyhint: 'done', required: '', 'aria-describedby': `${prefix}-count ${prefix}-nerr` });
  input.value = value;

  const err = h('p', { class: 'err', id: `${prefix}-nerr`, role: 'status', 'aria-live': 'polite' });
  const warn = idWarn(input, `${prefix}-warn`);
  let touched = false;
  const problem = () => displayNameProblem(input.value);
  const show = (force) => {
    const pr = problem();
    const on = pr && (touched || force);
    err.replaceChildren(...(on ? [icon('alert', 16), document.createTextNode(NAME_PROBLEM_TEXT[pr])] : []));
    if (on) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');

  input.addEventListener('input', () => { count.textContent = `${[...input.value.trim()].length} of ${NAME_MAX}`; if (touched) show(); });
  input.addEventListener('blur', () => { if (input.value.trim()) { touched = true; show(); } });
  const root = h('div', {}, h('label', { class: 'field', for: `${prefix}-name`, text: 'Your name' }), input, count, err, warn.p);

/** Change of name or avatar (lobby inline and header menu): `Save changes` (CASE-121). Epoch-fenced, so a stale_epoch is retried once. */

function buildRename(prefix) {
  const name = nameField(prefix);
  const pick = customAvatarPicker(prefix);
  const msg = h('p', { class: 'small', id: `${prefix}-msg`, role: 'status', 'aria-live': 'polite' });
  const btn = h('button', { type: 'submit', class: 'btn block', text: 'Save changes' });
  let dirty = false;
  name.input.addEventListener('input', () => { dirty = true; });
  pick.onPick(() => { dirty = true; });
  const root = h('form', { class: 'stack', novalidate: '' }, name.root, pick.root, btn, msg);
  root.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!name.valid()) { name.input.focus(); return; }
    if (!pick.valid()) return;
    const body = { displayName: name.value(), avatarId: pick.value() };
    btn.disabled = true;
    msg.textContent = S.conn === 'online' ? 'Saving…' : 'Waiting for connection · your changes will send automatically';
    let rb = await link.send('rename', body);
    if (rb.receipt === 'stale_epoch') { await sleep(700); rb = await link.send('rename', body); }
    btn.disabled = false;
    if (rb.receipt === 'accepted' || rb.receipt === 'already_accepted') {
      msg.textContent = 'Changes saved'; dirty = false;
      // Rename is quiet for phones; the server receipt confirms this phone's own saved appearance.
      if (S.view?.you) { S.view.you.name = body.displayName; S.view.you.avatarId = body.avatarId; render(); }
      root.closest('details')?.removeAttribute('open');
    }
    else if (rb.reason === 'unknown_participant') { S.removed = true; render(); }
    else msg.textContent = 'Not saved · check your name and try again';
  });
  return {
    root, input: name.input,
    sync() { if (!dirty && !root.contains(document.activeElement)) { name.set(S.view?.you?.name ?? ''); pick.set(S.view?.you?.avatarId ?? null); } },
  };
}

// ───────────────────────── join flow ─────────────────────────
// Code and required name, then Join case. Optional avatar choice receives a valid random default;
// the server still validates every submitted avatar. There is no nameless join.
function buildJoin() {
  let savedCode = '';
  try { savedCode = sessionStorage.getItem(JOIN_CODE_DRAFT) || ''; } catch { /* private browsing can deny storage */ }
  const code = h('input', { type: 'text', id: 'jcode', class: 'code-input', inputmode: 'text', autocomplete: 'off', autocapitalize: 'characters', autocorrect: 'off', spellcheck: 'false', maxlength: String(JOIN_CODE_LENGTH), minlength: String(JOIN_CODE_LENGTH), placeholder: '______', enterkeyhint: 'next', required: '', 'aria-describedby': 'jcode-hint jcode-err' });
  const codeHint = h('p', { class: 'hint', id: 'jcode-hint' });
  attachRoomCodeMask(code, codeHint, params.get('code') || savedCode);
  const codeErr = h('p', { class: 'err', id: 'jcode-err', role: 'alert' });
  const name = nameField('j');
  name.root.append(h('p', { class: 'hint', text: 'Do not enter patient details.' }));
  const pick = joinAvatarPicker('j');
  const preview = h('div', { class: 'preview', 'aria-hidden': 'true' });
  const updPreview = () => {
    const nm = name.value(), id = pick.value();
    preview.hidden = !nm && !id;
    preview.replaceChildren(avatarEl(id, { size: 40, name: nm }), h('span', { class: 'nm', text: nm || 'Your name' }));
  };
  name.input.addEventListener('input', updPreview);
  pick.onPick(updPreview);
  updPreview();
  const joinErr = h('p', { class: 'err', id: 'jerr', role: 'alert' });
  const joinBtn = h('button', { type: 'submit', class: 'btn primary block lg', text: 'Join case' });
  const status = h('p', { class: 'small muted', role: 'status', 'aria-live': 'polite' });
  const privacy = h('a', { href: 'privacy.html', text: 'Privacy' });
  privacy.addEventListener('click', () => {
    try {
      sessionStorage.setItem(JOIN_CODE_DRAFT, code.value);
      sessionStorage.setItem(PRIVACY_RETURN_SEARCH, safePrivacyReturnSearch(location.search));
    } catch { /* the link still works */ }
  });
  const form = h('form', { class: 'card', novalidate: '', 'aria-labelledby': 'mh' },
    h('h1', { id: 'mh', tabindex: '-1', 'data-focus-heading': '', text: 'Join the case' }),
    h('div', {}, h('label', { class: 'field', for: 'jcode', text: 'Room code' }), code, codeHint, codeErr),
    name.root, pick.root, preview,
    joinErr, status, h('p', { class: 'hint', text: 'Your name and avatar appear on the projector in the lobby.' }), joinBtn,
    h('footer', { class: 'join-footer' }, privacy));

  async function go() {
    codeErr.textContent = ''; joinErr.textContent = ''; code.removeAttribute('aria-invalid');
    const norm = normalizeCode(code.value, JOIN_CODE_LENGTH);
    if (!norm) { code.setAttribute('aria-invalid', 'true'); codeErr.replaceChildren(icon('alert', 16), document.createTextNode(C.invalidCode)); code.focus(); return; }
    if (!name.valid()) { name.input.focus(); return; }
    if (!pick.valid()) return;
    joinBtn.disabled = true;
    status.textContent = 'Joining…';
    const res = await link.join(norm, name.value(), pick.ensureSelected());
    if (res.ok) { try { sessionStorage.removeItem(JOIN_CODE_DRAFT); } catch { /* no stored draft */ } status.textContent = 'Joined · checking the room…'; render(); return; }
    joinBtn.disabled = false;
    status.textContent = '';
    const e = res.error;
    if (e === 'unknown_code' || e === 'bad_code') { code.setAttribute('aria-invalid', 'true'); codeErr.replaceChildren(icon('alert', 16), document.createTextNode(C.invalidCode)); code.focus(); }
    else if (e === 'bad_display_name' || e === 'unsafe_characters') { joinErr.textContent = NAME_PROBLEM_TEXT.characters; name.input.focus(); }
    else if (e === 'bad_avatar') joinErr.textContent = 'Choose an avatar';
    else if (e === 'joining_closed') joinErr.textContent = C.closed;
    else if (e === 'room_full') joinErr.textContent = 'This room is full';
    else if (e === 'removed') { S.removed = true; render(); }
    else if (e === 'network') joinErr.textContent = "Couldn't reach the room · check your connection and try again";
    else joinErr.textContent = "Couldn't join · check the code and try again";
  }
  form.addEventListener('submit', (ev) => { ev.preventDefault(); go(); });
  return form;
}

// ───────────────────────── room shell ─────────────────────────
function buildRoomShell() {

function setSection(node, sig, build) {
  if (node._sig === sig) return false;
  node._sig = sig;
  node.replaceChildren(...[].concat(build() ?? []));
  return true;
}

function updateRoom() {
  const v = S.view;
  const live = v.liveSurface;
  const groupKey = (entry) => JSON.stringify([entry?.scene, entry?.assetIds, entry?.observations, entry?.points, entry?.investigations]);
  const liveKey = live ? `${live.surfaceId}@${live.at}:${groupKey(live)}` : '';
  const dKey = `${v.decision?.roundId ?? ''}|${v.decision?.status ?? ''}`;
  const phaseKey = `${v.phase}|${dKey}`;
  const liveChanged = S.liveKey !== undefined && liveKey !== S.liveKey;
  const phaseChanged = S.phaseKey !== undefined && phaseKey !== S.phaseKey;
  if (liveChanged) {
    S.browseIndex = null; // the next shared reveal auto-advances every phone back to live
    S.note = v.phase === 'decision_open' ? 'Team decision open' : (v.phase === 'live' || v.phase === 'teaching') ? 'New material shared' : '';
    if (S.note) say(S.note);
  } else if (phaseChanged) S.note = '';
  S.liveKey = liveKey;
  S.phaseKey = phaseKey;

  const selected = publicTimelineEntry(v.timeline, S.browseIndex);
  const browsing = selected.browsing;
  if (!browsing) S.browseIndex = null;
  const entry = browsing ? selected.entry : live;

  const noteShown = browsing ? '' : S.note;
  if ($('note').textContent !== noteShown) $('note').textContent = noteShown;
  $('liveBar').hidden = !browsing;
  main.classList.toggle('pad-bar', browsing);
  el.browse.replaceChildren();
  if (browsing) el.browse.append(h('div', { class: 'banner info', role: 'note' }, icon('info', 18), h('span', { text: 'Earlier material · read-only' })));

  const lobby = v.phase === 'waiting';
  el.lobby.hidden = !lobby;
  el.title.hidden = lobby;
  if (lobby) updateLobby(v);

  const ended = v.phase === 'ended';
  const decisionShown = !!v.decision && !browsing;

  // banners: manual, pause, cancelled round
  const cancelled = v.lastRound?.status === 'abandoned' && !v.decision && !ended && !lobby;
  const held = v.decision?.status === 'held';
  const bsig = JSON.stringify([browsing, v.manual, v.phase, held, cancelled]);
  const bchanged = setSection(el.banners, bsig, () => {
    if (browsing || lobby) return [];
    const out = [];
    if (v.manual) out.push(h('div', { class: 'banner manual', role: 'note' }, icon('people', 18), h('span', { text: 'Facilitator-led discussion · phone answers are off for now' })));
    if (v.phase === 'paused') out.push(h('div', { class: 'stack' }, h('h2', { id: 'pauseH', tabindex: '-1', 'data-focus-heading': '', text: 'Discussion pause' }), held ? null : h('div', { class: 'banner pause', role: 'note' }, icon('pause', 18), h('span', { text: 'Paused · the facilitator will resume the room' }))));
    if (cancelled) out.push(h('div', { class: 'banner alert', role: 'note' }, icon('alert', 18), h('span', { text: C.voided })));
    if (v.phase === 'reviewing' && v.manual) out.push(h('p', { class: 'muted small', text: 'Facilitator-led discussion · phone answers are off for now' }));
    return out;
  });
  if (bchanged && cancelled) say(C.voided);

  // surface
  const showSurface = !!entry && !lobby && !(ended && !browsing);
  const ssig = JSON.stringify([showSurface, entry?.surfaceId, entry?.at, groupKey(entry), browsing, v.phase, decisionShown]);
  setSection(el.surface, ssig, () => (showSurface ? buildSurface(entry, { browsing, phase: v.phase, collapse: !browsing && (decisionShown || (v.phase === 'reviewing' && !!v.decision)) }) : []));

  // decision card
  if (!ended) updateDecision(v, decisionShown); else { resetDecision(); el.decision.hidden = true; }

  // room result (CASE-080)
  const rsig = JSON.stringify([browsing, v.lastResult, v.decision?.roundId, ended]);
  setSection(el.result, rsig, () => (!browsing && !ended && v.lastResult && !v.decision ? buildResult(v.lastResult) : []));

  // recap
  el.recap.hidden = !(ended && !browsing);
  setSection(el.recap, JSON.stringify([ended, browsing, v.recap]), () => (ended && !browsing ? buildRecap(v) : []));

  // timeline
  const tsig = JSON.stringify([v.timeline.map((e) => [e.surfaceId, e.at, e.timelineKind, e.manual]), live?.surfaceId, S.browseIndex]);
  const hadFocus = el.tl.contains(document.activeElement) ? document.activeElement?.dataset?.entryIndex : null;
  if (setSection(el.tl, tsig, () => buildTimeline(v)) && hadFocus) el.tl.querySelector(`button[data-entry-index="${CSS.escape(hadFocus)}"]`)?.focus({ preventScroll: true });

  // focus: never steal it from someone who is typing
  if (phaseChanged || liveChanged) {
    if (!typingNow()) {
      const a = document.activeElement;
      const lost = !a || a === document.body || !a.isConnected;
      if (lost) {
        const t = (decisionShown && el.decision.querySelector('[data-focus-heading]')) || main.querySelector('[data-focus-heading]');
        t?.focus({ preventScroll: true });
      }
    }
  }
  renderHeader();
}

// ───────────────────────── surfaces, results, timeline, lobby ─────────────────────────
function buildSurface(entry, { browsing, phase, collapse }) {
  const parts = [];
  if (entry.manual) parts.push(h('div', { class: 'banner manual', role: 'note' }, icon('people', 18), h('span', { text: 'Facilitator-led discussion' })));

    const ic = box.querySelector('.ic');
    const want = !text ? '' : kind === 'ok' ? 'check' : kind === 'pause' ? 'pause' : spin ? 'spinner' : 'info';
    if (box !== ra && ic.dataset.k !== want) { ic.dataset.k = want; ic.replaceChildren(...(want ? [icon(want, 16, want === 'spinner' ? 'spin' : '')] : [])); }
  };
  if (useAlert) { setText(rc, '', ''); setText(ra, m.text, 'alert'); }
  else { setText(ra, '', 'alert'); setText(rc, m?.text ?? '', m?.kind ?? '', m?.spin); }

  if (dec.layout === 'locked') {
    refs.saved.textContent = savedLabel ? `Your answer (locked): ${savedLabel}` : 'No answer recorded from this phone';
  } else {
    refs.saved.textContent = savedLabel ? `Your answer: ${savedLabel}` : '';
    const held = d.status === 'held';
    refs.fs.disabled = held;
    const online = S.conn === 'online';
    const draftResp = responseFromDraft(d);
    const sending = !!dec.pend;
    const unchanged = !!saved && sameResponse(draftResp, saved);
    const btn = refs.send;
    btn.replaceChildren();
    const inFlight = sending && dec.pend.state !== 'held';
    if (inFlight) { btn.append(icon('spinner', 18, 'spin'), document.createTextNode(' Sending…')); btn.setAttribute('aria-busy', 'true'); }
    else { btn.append(document.createTextNode(saved ? 'Change answer' : 'Send answer')); btn.removeAttribute('aria-busy'); }
    btn.disabled = sending || held || !online || !draftResp || unchanged;
    let hint = '';
    if (!online && !sending) hint = S.conn === 'lost' ? 'Answering is off until the connection returns' : 'Answering is off until the room reconnects';
    else if (!draftResp && refs.type === 'ranking') hint = `Rank exactly ${d.interaction.rankCount ?? enabledOptions(d).length} options to send`;
    else if (!draftResp && refs.type === 'multi_select') hint = 'Choose at least one option to send';
    else if (!draftResp && refs.type === 'single_choice') hint = 'Choose an option to send';
    else if (!draftResp) hint = 'Write an answer to send';
    if (refs.hint.textContent !== hint) refs.hint.textContent = hint;
  }
  renderTimer();
}

function onSend() {
  const v = S.view, d = v?.decision;
  if (!d || dec.pend || S.conn !== 'online') return;
  const response = responseFromDraft(d);
  if (!response) return;
  const body = { v: WIRE_VERSION, t: 'command', type: 'vote', epoch: S.snap?.epoch ?? 0, clientEventId: uuidv7(), roundId: d.roundId, response };
  dec.pend = { roundId: d.roundId, body, response, state: 'sending' };
  dec.msg = null;
  dispatchPending(dec.pend);
}
function dispatchPending(p) {
  p.state = 'sending';
  refreshDecision();
  link.sendFrame(p.body).then((rb) => onReceipt(p, rb));
}
function resend(p) {
  p.body = { ...p.body, epoch: S.snap?.epoch ?? p.body.epoch }; // same clientEventId, current epoch
  dispatchPending(p);
}

function onReceipt(p, rb) {
  if (dec.pend !== p) return; // dropped (round changed) or superseded
  const d = S.view?.decision;
  switch (rb.receipt) {
    case 'accepted': case 'already_accepted':
      dec.pend = null;
      dec.accepted = { roundId: p.roundId, response: p.response };
      dec.msg = ok(rb.receipt === 'accepted' ? C.saved : C.savedDup);
      break;
    case 'locked': {
      dec.pend = null; dec.locked = true;
      const had = d ? savedOf(d) : null;
      dec.msg = alertMsg(had ? C.lockedSaved : C.lockedNone);
      break;
    }
    case 'paused_held':
      p.state = 'held'; // keep the same clientEventId; resent when decision.status returns to open
      break;
    case 'stale_epoch':
      p.state = 'refetch';
      link.refetch(); // fresh snapshot, then reconcilePending resends under the new epoch
      setTimeout(() => { if (dec.pend === p && p.state === 'refetch') reconcilePending(S.view, true); }, 3000);
      break;
    case 'rejected': {
      dec.pend = null;
      const r = rb.reason;
      if (r === 'round_voided') dec.msg = alertMsg(C.voided);
      else if (r === 'manual_room') dec.msg = alertMsg(C.manualRoom);
      else if (r === 'unknown_participant') { S.removed = true; render(); return; }
      else if (r === 'room_ended') dec.msg = alertMsg(C.ended);
      else dec.msg = alertMsg(C.rejected); // client_event_id_reused, bad_response, unknown_round: the snapshot refetch follows
      break;
    }
    case 'timeout':
      p.state = 'waiting'; // bus gave up after MAX_TRIES: say so, keep the answer, retry with the same id
      setTimeout(() => { if (dec.pend === p && p.state === 'waiting') dispatchPending(p); }, 1000);
      break;
    default:
      dec.pend = null; dec.msg = alertMsg(C.rejected);
  }
  if (S.mode === 'room') { reconcilePending(S.view); refreshDecision(); }
}

function reconcilePending(v, force = false) {
  const p = dec.pend;
  if (!p || !v) return;
  const d = v.decision;
  if (!d || d.roundId !== p.roundId) { dec.pend = null; return; }
  if (d.status === 'locked') { // the round locked while the answer was held or in flight
    if (p.state !== 'sending') { dec.pend = null; dec.msg = alertMsg(savedOf(d) ? C.lockedSaved : C.lockedNone); }
    return;
  }
  if (p.state === 'held' && d.status === 'open') { resend(p); return; }
  if (p.state === 'refetch' && S.snap) {
    if (S.snap.epoch !== p.body.epoch || force) {
      if (d.status === 'open') resend(p); else p.state = 'held';
    }
  }
}

// ───────────────────────── advisory timer (text only, no pulse, polite at 60 / 10 / 0) ─────────────────────────
// ONE rounding with the console and the projector (src/shared/timer.mjs; walkthrough bug 3).
const announced = new Set();
function renderTimer() {
  const refs = dec.refs, v = S.view;
  if (!refs?.timer) return;
  const t = v?.decision && v.timer;
  if (!t) { refs.timer.textContent = ''; return; }
  const r = timerRemainingS(t, Date.now());
  const text = timerWords(r);
  if (refs.timer.textContent !== text) refs.timer.textContent = text;
  if (!t.paused) {
    for (const th of TIMER_ANNOUNCE_AT) {
      const k = `${v.decision.roundId}:${t.endsAt}:${th}`;
      if (r <= th && !announced.has(k)) {
        // Only announce a threshold while it is current (a late joiner does not hear the ones already passed).
        announced.add(k);
        const next = th === 60 ? 10 : th === 10 ? 0 : -1;
        if (r > next) say(text);
      }
    }
  }
}
setInterval(() => { if (S.mode === 'room') renderTimer(); }, 1000);

// ───────────────────────── go ─────────────────────────
render();
// Lab/debug hook only: nothing here carries the token or a name.
window.casePhone = { get view() { return S.view; }, get conn() { return S.conn; }, link };
</script>
</body>
