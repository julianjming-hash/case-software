<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case surface mockups</title>
<meta name="description" content="Case surface design proposal: participant, facilitator, projector, admin and authoring mockups built on the proposed design system. Synthetic content, local state only.">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/case-ui.css">
<script type="module" src="design/mosaic.mjs"></script>
<style>
  /* Gallery chrome only. Product surfaces use design/case-ui.css. */
  body { background: var(--sunken); }
  .g { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
  .g-nav { position: sticky; top: 0; height: 100vh; overflow: auto; padding: var(--sp-4); background: var(--nav-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--sp-3); }
  .g-nav .role { margin: var(--sp-4) var(--sp-2) var(--sp-1); }
  .g-nav button.s { display: flex; align-items: center; gap: var(--sp-2); width: 100%; min-height: 34px; padding: 4px var(--sp-2); border: 0; border-radius: 6px; background: none; color: var(--ink-muted); font-size: var(--t-sm); font-weight: var(--w-medium); text-align: left; }
  .g-nav button.s:hover { background: var(--quiet); color: var(--ink); }
  .g-nav button.s[aria-current="true"] { background: var(--petrol-tint); color: var(--petrol-ink); }
  .g-nav .dot { flex: none; width: 8px; height: 8px; border-radius: 2px; }
  .dot.live { background: var(--ok); } .dot.source { background: var(--ph-locked); } .dot.proposed { background: var(--private); }
  .g-main { min-width: 0; padding: var(--sp-5) var(--sp-6) var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-4); }
  .g-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }
  .g-top h1 { font-size: var(--t-xl); }
  .prov { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--t-xs); font-weight: var(--w-semibold); color: var(--ink-muted); }
  .frame { position: relative; margin: 0 auto; background: var(--ground); box-shadow: var(--shadow-2); overflow: hidden; }
  .frame.desktop { width: 100%; max-width: 1440px; min-height: 720px; border-radius: var(--radius); border: 1px solid var(--line); }
  .frame.phone { flex: none; width: 390px; height: 800px; min-height: 0; max-height: 800px; border-radius: 40px; border: 10px solid #0d1214; overflow: auto; }
  .frame.phone.tall { height: auto; min-height: 800px; }
  .frame.projector { width: 100%; max-width: 1440px; aspect-ratio: 16 / 9; border-radius: 6px; border: 8px solid #0d1214; }
  .frame.projector .scaler { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  /* The mockup emulates a 1920×1080 projector viewport, so viewport-relative projector tokens are pinned here. */
  .scaler .projector { --projector-code: 164px; --projector-qr: 340px; }
  .frame .content > .app, .frame .content > .phone, .frame .content > .console { min-height: 100%; }
  .frame > .content { min-height: inherit; height: 100%; }
  .notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--sp-5); max-width: 1440px; margin: var(--sp-2) auto 0; width: 100%; padding: var(--sp-5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .notes h2 { font-size: var(--t-sm); margin-bottom: var(--sp-2); }
  .notes p, .notes li { font-size: var(--t-sm); color: var(--ink-muted); }
  .notes ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
  .notes code { font-family: var(--mono); font-size: .9em; }
  .overlay-scrim { position: absolute; inset: 0; background: rgba(13, 18, 20, .45); display: flex; z-index: var(--z-overlay); }
  .overlay-scrim.right { justify-content: flex-end; }
  .overlay-scrim.center { align-items: center; justify-content: center; padding: var(--sp-5); }
  .present .g { grid-template-columns: 1fr; } .present .g-nav, .present .g-top, .present .notes { display: none; } .present .g-main { padding: 0; }
  .present .frame { max-width: none; border: 0; border-radius: 0; box-shadow: none; }
  .present .frame.projector { width: 100vw; height: 100vh; aspect-ratio: auto; }
  @media (max-width: 900px) { .g { grid-template-columns: 1fr; } .g-nav { position: static; height: auto; } .g-main { padding: var(--sp-4); } .frame.phone { width: 100%; max-width: 390px; } }
</style>
</head>

<div class="g">
  <nav class="g-nav" aria-label="Mockup states">
    <div class="row between"><span class="wordmark"><svg class="tessera" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="0" width="7" height="7" rx="1"/><rect class="t2" x="9" y="0" width="7" height="7" rx="1"/><rect class="t3" x="0" y="9" width="7" height="7" rx="1"/><rect x="9" y="9" width="7" height="7" rx="1"/></svg>CASE</span><a class="small" href="design-system.html">Design system</a></div>

      <span class="prov"><i class="dot live"></i>Observed in the live room, restyled</span>
      <span class="prov"><i class="dot source"></i>From source, not seen live</span>
      <span class="prov"><i class="dot proposed"></i>Proposed: needs new production work</span>
    </div>
    <div id="nav-list"></div>
  </nav>
  <main class="g-main">
    <div class="g-top">
      <div class="stack stack-sm"><h1 id="s-title"></h1><span class="prov" id="s-prov"></span></div>
      <div class="row">
        <div class="segmented" role="group" aria-label="Frame" id="frame-switch"><button data-frame="desktop">Desktop</button><button data-frame="phone">Phone</button><button data-frame="projector">Projector</button></div>
        <a class="btn quiet" id="present-link" href="#">Present</a>
      </div>
    </div>
    <div class="frame" id="frame"><div class="content" id="content"></div></div>
    <section class="notes" id="notes" aria-label="Design notes for this state"></section>

</div>

<!-- phone room: shared bar -->
<template id="t-material">
  <div class="phone">
    <div class="phone-bar" data-pbar="Live surface" data-phase="reveal"></div>
    <div class="phone-main">
      <article class="stack">
        <h1>Primary survey</h1>
        <p>He talks, but only in short phrases. His right chest barely moves, is silent to the stethoscope and booms when percussed; the trachea sits slightly to the left and his neck veins are full despite the blood loss.</p>
        <div class="vitals"><div><span>HR</span><strong>134</strong></div><div><span>BP</span><strong>78/50</strong></div><div><span>RR</span><strong>38</strong></div><div><span>SpO₂</span><strong>86%</strong></div><div><span>Temp</span><strong>35.4</strong></div><div><span>GCS</span><strong>14</strong></div></div>
        <h2 style="font-size:var(--t-md)">Findings</h2>
        <ul class="small" style="margin:0;padding-left:1.2em"><li>Airway patent, short phrases</li><li>Right chest: poor movement, absent air entry, hyperresonant</li><li>Left chest clear</li><li>Radial pulse weak and fast</li></ul>
      </article>
      <section class="stack stack-sm"><h2 style="font-size:var(--t-sm)">Timeline</h2><div class="timeline"><button><span>Earlier</span>Arrival</button><button aria-current="step"><span>Live</span>Primary survey</button></div></section>
    </div>
  </div>
</template>

<template id="t-decision">
  <div class="phone">
    <div class="phone-bar" data-pbar="Team decision" data-phase="open"></div>
    <div class="phone-main">
      <details class="disclose situation small"><summary>Situation: Primary survey</summary><p>He talks, but only in short phrases. His right chest barely moves…</p></details>
      <form class="stack" onsubmit="return false">
        <div class="row between"><span class="label-caps">Team decision</span><span class="small muted mono">0:58</span></div>
        <h1>What is the next decisive intervention?</h1>
        <div class="stack stack-sm" role="radiogroup" aria-label="Options">
          <label class="option" data-mk="0"><input type="radio" name="d1"><span data-mark="0"></span>Chest X-ray before decompression<span class="check"></span></label>
          <label class="option" data-mk="1"><input type="radio" name="d1"><span data-mark="1"></span>RSI and intubate before decompression<span class="check"></span></label>
          <label class="option" data-mk="2"><input type="radio" name="d1" checked><span data-mark="2"></span>Needle decompression, right chest<span class="check"></span></label>
          <label class="option" data-mk="3"><input type="radio" name="d1"><span data-mark="3"></span>Finger thoracostomy, right chest<span class="check"></span></label>
        </div>
        <button class="btn primary lg block" data-go="saved">Send answer</button>
        <p class="hint small muted">You can change it until responses lock.</p>
      </form>
      <section class="stack stack-sm"><h2 style="font-size:var(--t-sm)">Timeline</h2><div class="timeline"><button><span>Earlier</span>Arrival</button><button aria-current="step"><span>Live</span>Primary survey</button></div></section>
    </div>
  </div>
</template>

          <label class="option multi" data-mk="2"><input type="checkbox"><span data-mark="2"></span>Bilateral equal air entry<span class="check"></span></label>
          <label class="option multi" data-mk="3"><input type="checkbox"><span data-mark="3"></span>Rising SpO₂ on oxygen<span class="check"></span></label>
        </div>

      </form>
    </div>

</template>

<template id="t-decision-rank">
  <div class="phone">
    <div class="phone-bar" data-pbar="Team decision" data-phase="open"></div>
    <div class="phone-main">
      <form class="stack" onsubmit="return false">
        <span class="label-caps">Team decision</span>
        <h1>Put the next three actions in order</h1>
        <p class="small muted">Rank 3 options</p>
        <ol class="stack stack-sm" style="margin:0;padding:0;list-style:none" aria-label="Your order">
          <li class="option static" data-mk="2"><span class="mono small" style="width:1.2em">1</span><span data-mark="2"></span><span class="grow">Needle decompression</span><button class="btn icon quiet" aria-label="Move Needle decompression down">↓</button><button class="btn icon quiet" aria-label="Remove Needle decompression">×</button></li>
          <li class="option static" data-mk="3"><span class="mono small" style="width:1.2em">2</span><span data-mark="3"></span><span class="grow">Finger thoracostomy</span><button class="btn icon quiet" aria-label="Move Finger thoracostomy up">↑</button><button class="btn icon quiet" aria-label="Remove Finger thoracostomy">×</button></li>
        </ol>

/* ── gallery shell ── */
const params = new URLSearchParams(location.search);
const present = params.get('present') === '1';
if (present) document.documentElement.classList.add('present');
const content = document.getElementById('content'), frame = document.getElementById('frame');
let current = null, frameOverride = null;
const PROV = { live: ['live', 'Observed in the live room, restyled'], source: ['source', 'From source, not seen live'], proposed: ['proposed', 'Proposed: needs new production work'] };

function nav() {
  const host = document.getElementById('nav-list'); let role = null;
  for (const s of S) {
    if (s.role !== role) { role = s.role; host.append(el('p', { class: 'label-caps role' }, role)); }
    host.append(el('button', { class: 's', 'data-go': s.id }, el('i', { class: 'dot ' + s.prov }), s.title));
  }
}
function scaleProjector() {
  const sc = frame.querySelector('.scaler');
  if (!sc) { frame.style.height = ''; return; }
  const w = frame.clientWidth;
  const h = present ? innerHeight : Math.round(w * 9 / 16);
  if (!present) frame.style.height = (h + 16) + 'px';   // + 2 × 8px frame border
  const k = Math.min(w / 1920, (present ? innerHeight : h) / 1080);

}

  const tpl = document.getElementById('t-' + s.id).content.cloneNode(true);
  if (fr === 'projector' && s.frame === 'projector') { const sc = el('div', { class: 'scaler' }); sc.append(tpl); content.replaceChildren(sc); } else content.replaceChildren(tpl);
  bars(content); routes(content); people(content); catalogue(content); admin(content); interactions(content);
  hydrateMarks(content); hydrateQr(content);
  requestAnimationFrame(() => { scaleProjector(); CaseMosaic.paintAll(content); });
  document.getElementById('s-title').textContent = s.role + ' · ' + s.title;
  const p = PROV[s.prov]; const prov = document.getElementById('s-prov'); prov.replaceChildren(el('i', { class: 'dot ' + p[0] }), p[1]);
  document.querySelectorAll('.g-nav button.s').forEach((b) => b.setAttribute('aria-current', String(b.dataset.go === s.id)));
  document.querySelectorAll('#frame-switch button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.frame === fr)));
  const notes = document.getElementById('notes'); notes.replaceChildren();
  const block = (h, items) => { if (!items || !items.length) return; notes.append(el('div', {}, el('h2', {}, h), el('ul', {}, ...items.map((t) => el('li', {}, t))))); };
  block('What changed (before → after)', s.changed); block('Kept exactly', s.kept); block('Risks and dependencies', s.risk);
  if (!notes.children.length) notes.append(el('p', {}, 'No change from the live behaviour; restyled with the system only.'));
  document.getElementById('present-link').href = '?present=1&state=' + s.id + (frameOverride ? '&frame=' + frameOverride : '');
  if (push) history.replaceState(null, '', '?' + (present ? 'present=1&' : '') + 'state=' + s.id + (frameOverride ? '&frame=' + frameOverride : ''));
  content.scrollTop = 0;
}
// Living mosaic: a tap anywhere on an arrival or lobby surface sends a ripple through its art. Covers are canvas and stay still.
content.addEventListener('pointerdown', (e) => { const sp = e.target.closest('.splash'); const art = sp && sp.querySelector('.splash-art > [data-mosaic]'); if (art) CaseMosaic.ripple(art, e.clientX, e.clientY); });
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); frameOverride = null; show(go.dataset.go); return; }
  const f = e.target.closest('[data-frame]');
  if (f) { frameOverride = f.dataset.frame === current.frame ? null : f.dataset.frame; show(current.id); }
});
addEventListener('resize', scaleProjector);
initTheme(); nav();
frameOverride = params.get('frame');
show(params.get('state') || 'home', false);
